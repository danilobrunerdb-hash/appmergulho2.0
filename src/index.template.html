<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140812">
<title>Tabela de Mergulho CBMMG</title>
<link rel="icon" href="/*__LOGO__*/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --ink: #0F172A; --ink-2: #334155; --muted: #94A3B8; --muted-2: #64748B;
  --field: #F8FAFC; --line: #E2E8F0; --soft: #F1F5F9;
  --red: #B91C1C; --red-dark: #7F1D1D; --red-soft: #FEF2F2;
  --ok: #15803D; --ok-soft: #F0FDF4; --warn: #92400E; --warn-soft: #FFFBEB; --stop: #B91C1C;
  --font: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: inherit; }
html { min-height: 100%; background: #030816; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; font-family: var(--font); font-size: 16px; line-height: 1.45; color: var(--ink);
  background: radial-gradient(120% 60% at 50% 0%, #2A0B1E 0%, #140812 45%, #030816 100%) fixed; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #FBBF24; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.page { max-width: 460px; margin: 0 auto; padding: 12px 10px 24px; }
.sheet { background: #fff; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.45); }

/* Cabeçalho vermelho, como a tela de referência */
.top { background: linear-gradient(180deg, #C42121 0%, #8E1B1B 100%); color: #fff; text-align: center; padding: 18px 18px 22px; position: relative; }
.top img { width: 84px; height: 84px; display: block; margin: 4px auto 10px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
.top.big img { width: 116px; height: 116px; margin-top: 18px; }
.top h1 { margin: 0; font-size: 1.55rem; font-weight: 900; letter-spacing: -.035em; line-height: 1.1; }
.top.big h1 { font-size: 1.9rem; }
.top p { margin: 8px 0 0; font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.ib { position: absolute; top: 14px; width: 48px; height: 48px; border-radius: 15px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; cursor: pointer; }
.ib svg { width: 22px; height: 22px; }
.ib.l { left: 14px; } .ib.r { right: 14px; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.3); }
.dots i.on { width: 26px; background: #fff; } .dots i.done { background: rgba(255,255,255,.75); }

.body { padding: 22px 20px 24px; }
.lbl { display: flex; align-items: center; gap: 8px; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.field { margin-bottom: 18px; }
.field input { width: 100%; height: 62px; background: var(--field); border: 1px solid var(--line); border-radius: 18px; padding: 0 18px; font-size: 1.45rem; font-weight: 800; }
.field input::placeholder { color: #B6C0CD; font-weight: 600; }
.field input[aria-invalid="true"] { border-color: var(--stop); background: var(--red-soft); }
.unit { position: relative; } .unit span { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-weight: 800; color: var(--muted-2); pointer-events: none; }
.err { color: var(--stop); font-size: .86rem; font-weight: 700; margin-top: 6px; } .err:empty { display: none; }
.q { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-weight: 900; font-size: .85rem; cursor: pointer; flex: 0 0 26px; letter-spacing: 0; }
.ask { font-size: 1.2rem; font-weight: 900; letter-spacing: -.02em; margin: 0 0 14px; line-height: 1.25; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.yn button { height: 64px; border-radius: 18px; border: 1px solid var(--line); background: var(--field); font-weight: 900; font-size: 1.15rem; letter-spacing: .04em; cursor: pointer; }
.yn button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.note { background: var(--soft); border-radius: 16px; padding: 12px 14px; font-size: .9rem; color: var(--ink-2); margin: 0 0 18px; }
.note b { color: var(--ink); }
.help { background: #EFF6FF; border-radius: 16px; padding: 14px 16px; font-size: .9rem; color: #1E3A8A; margin: -6px 0 18px; }
.help ol { margin: 6px 0 0; padding-left: 20px; } .help li { margin: 4px 0; }

.btn { width: 100%; height: 62px; border: 0; border-radius: 18px; background: var(--red); color: #fff; font-weight: 800; font-size: 1.02rem; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 5px 0 var(--red-dark); cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--red-dark); }
.btn[disabled] { background: #CBD5E1; box-shadow: 0 5px 0 #94A3B8; cursor: not-allowed; }
.btn.alt { background: var(--soft); color: var(--ink); box-shadow: 0 4px 0 #CBD5E1; }
.link { display: block; width: 100%; margin-top: 14px; background: none; border: 0; color: var(--muted-2); font-weight: 700; font-size: .9rem; text-decoration: underline; cursor: pointer; padding: 8px; }

/* Resultados */
.hero { background: var(--ink); color: #fff; border-radius: 22px; padding: 18px 18px 16px; text-align: center; margin-bottom: 12px; }
.hero small { display: block; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #94A3B8; }
.hero b { display: block; font-size: 3rem; font-weight: 900; letter-spacing: -.04em; line-height: 1.05; margin: 4px 0 2px; }
.hero b span { font-size: 1.2rem; letter-spacing: 0; color: #CBD5E1; }
.hero em { font-style: normal; font-size: .78rem; color: #94A3B8; }
.hero.red { background: linear-gradient(135deg, #DC2626, #7F1D1D); } .hero.red small, .hero.red em, .hero.red b span { color: #FECACA; }
.hero.green { background: linear-gradient(135deg, #16A34A, #14532D); } .hero.green small, .hero.green em, .hero.green b span { color: #BBF7D0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.pair .hero { margin: 0; padding: 16px 10px 14px; } .pair .hero b { font-size: 2.3rem; }
.list { margin: 0 0 18px; }
.list div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--soft); font-size: .95rem; }
.list dt { color: var(--ink-2); font-weight: 600; } .list dt .fine { font-size: .75rem; } .list dd { margin: 0; font-weight: 900; text-align: right; }
.al { border-radius: 16px; padding: 12px 14px; font-size: .92rem; margin: 0 0 12px; }
.al.stop { background: var(--red-soft); color: #7F1D1D; } .al.warn { background: var(--warn-soft); color: var(--warn); } .al.ok { background: var(--ok-soft); color: #14532D; }
.al b { font-weight: 900; }
.src { display: block; text-align: center; font-size: .72rem; color: var(--muted); margin: -4px 0 16px; }

/* Passo 0 */
.tw { overflow-x: auto; margin: 0 -4px 16px; }
table.o { width: 100%; border-collapse: collapse; font-size: .82rem; table-layout: fixed; }
table.o col.c1 { width: 27%; } table.o col.c3 { width: 22%; }
table.o small { font-weight: 600; color: var(--muted-2); font-size: .72rem; }
table.o th { text-align: left; font-size: .64rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 6px 8px; }
table.o td { padding: 10px 6px; border-top: 1px solid var(--line); vertical-align: top; }
table.o td:first-child { font-weight: 900; font-size: .9rem; line-height: 1.2; }
table.o td:last-child { font-weight: 800; }
.tag { display: inline-block; font-size: .62rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--ink); color: #fff; border-radius: 99px; padding: 2px 7px; margin-top: 4px; }
ul.r { margin: 0 0 18px; padding-left: 18px; font-size: .88rem; color: var(--ink-2); } ul.r li { margin: 5px 0; }
h2 { font-size: 1.05rem; font-weight: 900; margin: 4px 0 10px; letter-spacing: -.01em; }

/* Referências */
details { border-top: 1px solid var(--line); } details:last-of-type { border-bottom: 1px solid var(--line); }
summary { padding: 15px 2px; font-weight: 800; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; } summary::after { content: "+"; font-weight: 900; color: var(--muted); } details[open] summary::after { content: "−"; }
.tb { overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; }
table.g { border-collapse: separate; border-spacing: 0; font-size: .8rem; font-variant-numeric: tabular-nums; }
table.g th, table.g td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 7px; text-align: center; min-width: 38px; background: #fff; }
table.g thead th { position: sticky; top: 0; background: var(--soft); z-index: 2; }
table.g th.rh { position: sticky; left: 0; background: var(--soft); z-index: 1; white-space: nowrap; }
table.g thead th.rh { z-index: 3; }
table.g td.x { background: repeating-linear-gradient(45deg, #F8FAFC, #F8FAFC 4px, #E2E8F0 4px, #E2E8F0 5px); }
table.g td.n { font-weight: 900; color: var(--red); } table.g td.d { background: var(--ink); color: #fff; font-size: .72rem; line-height: 1.15; } table.g td.d em { font-style: normal; color: #FCA5A5; display: block; }
table.g td.t span { display: block; line-height: 1.15; } table.g td.t .rr { color: var(--red); font-weight: 800; }
.fine { font-size: .78rem; color: var(--muted-2); margin: 0 0 14px; }
.foot { color: #94A3B8; font-size: .72rem; text-align: center; padding: 16px 12px 0; line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #fff; color: var(--ink); padding: 12px 18px; border-radius: 14px; font-weight: 800; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 90vw; text-align: center; }

/* v4 – mergulhadores, autonomia, posição na tabela */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dmax { font-size: .82rem; color: var(--ink-2); margin: -4px 0 12px; line-height: 1.4; } .dmax b.amb { color: #B45309; }
.hero.amber { background: linear-gradient(135deg, #D97706, #92400E); } .hero.amber small, .hero.amber em, .hero.amber b span { color: #FDE68A; }
.fuel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: -4px 0 10px; }
.fuel div { background: var(--soft); border-radius: 14px; padding: 9px 12px; border: 2px solid transparent; }
.fuel div.win { border-color: var(--ink); background: #fff; }
.fuel small { display: block; font-size: .64rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); }
.fuel b { font-size: 1.05rem; font-weight: 900; }
.air { display: flex; gap: 12px; align-items: flex-start; border: 2px solid #D97706; background: #FFFBEB; color: #78350F; border-radius: 16px; padding: 12px 14px; font-size: .9rem; margin: 0 0 12px; line-height: 1.4; }
.air svg { width: 28px; height: 28px; flex: 0 0 28px; color: #B45309; margin-top: 2px; }
.air b { color: #451A03; }
.tbtn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; margin: 4px 0 12px; font-size: .9rem; }
.tbtn svg { width: 22px; height: 22px; }
.btn.sm { height: 48px; font-size: .82rem; margin-top: 10px; }
.btn.line { background: transparent; color: var(--red); border: 2px dashed #FCA5A5; box-shadow: none; height: 54px; margin: 2px 0 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: -6px -20px 16px; padding: 2px 20px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px 0 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--field); font-weight: 800; font-size: .86rem; cursor: pointer; white-space: nowrap; }
.chip .g { width: 34px; height: 34px; border-radius: 50%; background: #E2E8F0; display: grid; place-items: center; font-weight: 900; }
.chip .g.fin { background: #DCFCE7; color: #14532D; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); } .chip.on .g { background: #fff; color: var(--ink); }
.chip.add { width: 46px; padding: 0; justify-content: center; font-size: 1.4rem; color: var(--red); border-style: dashed; border-color: #FCA5A5; background: #fff; }
.count { font-size: .7rem; font-weight: 800; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.diver { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px 0 12px; margin-bottom: 10px; }
.dnum { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: .85rem; flex: 0 0 30px; margin-top: 22px; }
.dfields { flex: 1; min-width: 0; } .dfields .field { margin-bottom: 12px; }
.diver .x { background: none; border: 0; color: var(--muted-2); width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; margin-top: 18px; }
.diver .x svg { width: 20px; height: 20px; }
.field input.sm { height: 52px; font-size: 1.05rem; font-weight: 700; }
.cyl { background: var(--soft); border-radius: 18px; padding: 14px 14px 12px; margin-top: 4px; }
.cyl .field input { background: #fff; }
.endd { border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 4px; margin-bottom: 12px; }
.endd .list { margin-bottom: 10px; }
.endh { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.endh .g { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 1.1rem; }
.endh b { flex: 1; font-size: 1rem; } .endh em { font-style: normal; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); }
.tsec { margin-top: 18px; }
.tsec h2 { display: flex; align-items: center; gap: 10px; }
.sn { width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-size: .8rem; flex: 0 0 26px; }
.tsec .tb { max-height: 300px; }
table.g .hl { background: #FEF9C3 !important; color: #713F12; }
table.g td.hlr { background: #FEFCE8; }
table.g td.d.hlr { background: #334155; }
table.g .hit { background: #FACC15 !important; color: #422006 !important; font-weight: 900; box-shadow: inset 0 0 0 3px #A16207; }
table.g .hit em { color: #7F1D1D !important; }

/* ===== Layout alternativo para PC e tablet (o celular não muda) ===== */
.steplist, .side-foot { display: none; }
@media (min-width: 640px) and (max-width: 999px) {
  .page { max-width: 620px; padding-top: 24px; }
}
@media (min-width: 1000px) {
  body { font-size: 16px; }
  .page { max-width: 1200px; padding: 28px 28px 32px; }
  .foot { display: none; }
  .sheet { --side: clamp(250px, 23vw, 300px); display: grid; grid-template-columns: var(--side) minmax(0, 1fr); overflow: clip; min-height: calc(100vh - 60px);
    background: linear-gradient(90deg, #8E1B1B 0 var(--side), #fff var(--side) 100%); }
  /* coluna vermelha lateral, fixa durante a rolagem */
  .top, .top.big { position: sticky; top: 28px; align-self: start; min-height: calc(100vh - 60px); border-radius: 0;
    display: flex; flex-direction: column; align-items: center; padding: 76px 26px 24px; background: linear-gradient(180deg, #C42121 0%, #8E1B1B 70%); }
  .top img, .top.big img { width: 108px; height: 108px; margin: 0 auto 16px; }
  .top h1, .top.big h1 { font-size: 1.6rem; }
  .ib { top: 18px; } .ib.l { left: 18px; } .ib.r { right: 18px; }
  .top .dots { display: none; }
  .steplist { display: block; list-style: none; margin: 30px 0 0; padding: 0; width: 100%; text-align: left; }
  .steplist li { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 14px; font-size: .9rem; font-weight: 700; color: rgba(255,255,255,.62); }
  .steplist li span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 900; border: 2px solid rgba(255,255,255,.35); flex: 0 0 28px; }
  .steplist li.done { color: rgba(255,255,255,.9); } .steplist li.done span { background: rgba(255,255,255,.22); border-color: transparent; }
  .steplist li.on { background: rgba(255,255,255,.16); color: #fff; } .steplist li.on span { background: #fff; color: #8E1B1B; border-color: #fff; }
  .top .side-foot { display: block; margin-top: auto; padding-top: 24px; font-size: .72rem; line-height: 1.5; text-align: center; color: rgba(255,255,255,.65); letter-spacing: 0; text-transform: none; font-weight: 600; }
  .body { padding: 40px clamp(28px, 3vw, 44px) 44px; }
  /* duas colunas de conteúdo */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: start; }
  .cols:has(table.o) { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
  table.o col.c1 { width: 22%; } table.o col.c3 { width: 21%; }
  .sheet:not(.wide) .body:not(:has(.cols)) { max-width: 640px; }
  .chips { margin: 0 0 22px; padding: 2px 0 6px; flex-wrap: wrap; overflow: visible; }
  .hero b { font-size: 3.2rem; } .pair .hero b { font-size: 2.6rem; }
  .yn button, .btn { cursor: pointer; }
  .tbtn { font-size: .82rem; letter-spacing: .08em; padding: 0 12px; }
  .btn:hover { filter: brightness(1.07); } .chip:hover, .yn button:hover { border-color: #94A3B8; }
  .field input { height: 60px; }
  table.o { font-size: .88rem; }
  /* telas de tabela: área inteira */
  .tb { max-height: 70vh; } .tsec .tb { max-height: 440px; }
  table.g { font-size: .88rem; } table.g th, table.g td { padding: 7px 9px; min-width: 44px; }
  .sheet.wide .body { padding: 36px 40px; }
  .toast { bottom: 32px; }
}
@media (min-width: 1000px) and (max-height: 760px) {
  .top img, .top.big img { width: 84px; height: 84px; } .top, .top.big { padding-top: 70px; } .steplist { margin-top: 18px; } .steplist li { padding: 6px 12px; }
}
</style>
</head>
