<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3121C">
<title>Tabela de Mergulho CBMMG</title>
<link rel="icon" href="/*__LOGO__*/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mergulho CBMMG">
<meta name="application-name" content="Mergulho CBMMG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tabela de Mergulho CBMMG — layout moderno =====
   Identidade: vermelho CBMMG na navegação e ações; resultados como o visor de um
   computador de mergulho (fundo azul-profundo, números condensados, faixa de status). */
:root {
  box-sizing: border-box;
  --paper: #F2F4F6; --surface: #FFFFFF; --soft: #F4F6F8; --soft-2: #E9EDF1; --line: #D9DFE5; --line-2: #C3CCD5;
  --ink: #14212C; --ink-2: #3A4855; --muted: #66737F; --faint: #A0AAB4;
  --red: #B3121C; --red-hover: #9C0F18; --red-deep: #7A0B12; --red-soft: #FDEEEE;
  --abyss: #0D2B3E; --abyss-2: #163C55; --abyss-ink: #A9C1D1;
  --g-green: #5FD39B; --g-amber: #FFB547; --g-red: #FF8A80;
  --ok: #1E7A4C; --ok-soft: #EAF6EF; --warn: #7A4A00; --warn-soft: #FFF4DE; --amber: #D48A06; --stop: #B3121C;
  --r-s: 10px; --r-m: 14px; --r-l: 18px;
  --font: "Barlow", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --num: "Barlow Condensed", "Barlow", "Roboto Condensed", "Arial Narrow", "DejaVu Sans Condensed", sans-serif;
}
*, *::before, *::after { box-sizing: inherit; }
html { min-height: 100%; background: var(--surface); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--surface);
  -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #2F80C0; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
b, strong { font-weight: 700; }

.page { max-width: 560px; margin: 0 auto; padding: 0 0 calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--surface); }

/* ---------- Barra superior (celular) ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--red); color: #fff;
  display: grid; grid-template-columns: 44px 40px minmax(0, 1fr) 44px; grid-template-areas: "back logo tt ref" "dots dots dots dots";
  align-items: center; column-gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 0; }
.ib { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; }
.ib:hover { background: rgba(255,255,255,.12); }
.ib svg { width: 22px; height: 22px; }
.ib span { display: none; }
.ib.l { grid-area: back; } .ib.r { grid-area: ref; }
.brand { grid-area: logo; display: flex; align-items: center; }
.brand img { width: 40px; height: 40px; display: block; }
.brand .bt { display: none; }
.tt { grid-area: tt; min-width: 0; }
.tt h1 { margin: 0; font-size: 1.12rem; font-weight: 700; line-height: 1.2; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt p { margin: 1px 0 0; font-size: .8rem; font-weight: 500; color: rgba(255,255,255,.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { grid-area: dots; display: flex; gap: 4px; padding: 10px 0 10px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }
.dots i.done { background: rgba(255,255,255,.7); } .dots i.on { background: #fff; }
.top:not(:has(.dots)) { padding-bottom: 8px; }
.steplist, .side-foot, .ph { display: none; }

/* Tela inicial (Passo 0): abertura com o brasão em destaque */
.top.big { position: relative; grid-template-columns: 1fr 44px; grid-template-areas: "x ref" "logo logo" "tt tt" "dots dots"; text-align: center; padding-bottom: 0;
  background: radial-gradient(130% 90% at 50% 0%, #C8202A 0%, var(--red) 45%, var(--red-deep) 100%); }
.top.big .brand { justify-content: center; flex-direction: column; margin-top: -8px; }
.top.big .brand img { width: 112px; height: 112px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.3)); }
.top.big .tt { padding: 14px 0 6px; }
.top.big .tt h1 { font-family: var(--num); font-size: 2.1rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; white-space: normal; line-height: 1.05; }
.top.big .tt p { font-size: .92rem; margin-top: 4px; }
.top.big .dots { padding: 14px 0 12px; }

/* ---------- Conteúdo ---------- */
.body { padding: 20px 18px 8px; }
h2 { font-size: 1.08rem; font-weight: 700; margin: 4px 0 12px; letter-spacing: -.005em; }
.lbl { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.field { margin-bottom: 18px; }
.field input { width: 100%; height: 56px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-m); padding: 0 16px;
  font-size: 1.3rem; font-weight: 600; transition: border-color .15s, box-shadow .15s; }
.field input:hover { border-color: var(--line-2); }
.field input:focus { outline: none; border-color: var(--abyss); box-shadow: 0 0 0 4px rgba(13,43,62,.12); }
.field input::placeholder { color: var(--faint); font-weight: 500; }
.field input[aria-invalid="true"] { border-color: var(--stop); background: var(--red-soft); }
.field input.sm { height: 48px; font-size: 1.05rem; font-weight: 600; padding: 0 14px; }
.unit { position: relative; } .unit span { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-weight: 600; font-size: .95rem; color: var(--muted); pointer-events: none; }
.err { color: var(--stop); font-size: .86rem; font-weight: 600; margin-top: 6px; } .err:empty { display: none; }
.q { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-weight: 700; font-size: .78rem; cursor: pointer; flex: 0 0 22px; display: grid; place-items: center; padding: 0; line-height: 1; }
.q[aria-expanded="true"] { background: var(--abyss); border-color: var(--abyss); color: #fff; }
.ask { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; margin: 0 0 14px; line-height: 1.3; }

/* Sim / Não: dois botões separados, com bom espaço para o toque */
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
.yn button { height: 58px; border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 1.08rem; letter-spacing: .04em; color: var(--ink-2); cursor: pointer;
  box-shadow: 0 1px 2px rgba(20,33,44,.06); transition: background .15s, color .15s, border-color .15s; }
.yn button:hover { border-color: var(--line-2); color: var(--ink); }
.yn button[aria-pressed="true"] { background: var(--abyss); border-color: var(--abyss); color: #fff; box-shadow: 0 2px 6px rgba(13,43,62,.25); }

.note { background: var(--soft); border-radius: var(--r-m); padding: 12px 14px; font-size: .94rem; color: var(--ink-2); margin: 0 0 18px; }
.note b { color: var(--ink); }
.help { background: #EAF2F7; border-radius: var(--r-m); padding: 14px 16px; font-size: .92rem; color: #12384F; margin: 0 0 14px; }
.help ol { margin: 6px 0 0; padding-left: 20px; } .help li { margin: 4px 0; }

/* Botões */
.btn { width: 100%; height: 54px; border: 0; border-radius: var(--r-m); background: var(--red); color: #fff; font-weight: 700; font-size: 1.06rem; letter-spacing: .01em;
  cursor: pointer; transition: background .15s, transform .05s; display: block; }
.btn:hover { background: var(--red-hover); }
.btn:active { transform: scale(.99); }
.btn[disabled] { background: var(--soft-2); color: var(--faint); cursor: not-allowed; }
.btn.alt { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.alt:hover { border-color: var(--line-2); background: var(--soft); }
.btn.line { background: transparent; color: var(--red); border: 1.5px dashed #E5A3A6; height: 50px; margin: 2px 0 16px; }
.btn.line:hover { background: var(--red-soft); }
.btn.sm { height: 44px; font-size: .92rem; margin-top: 10px; }
.tbtn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; margin: 4px 0 14px; font-size: .96rem; }
.tbtn svg { width: 20px; height: 20px; color: var(--abyss); }
.link { display: block; width: 100%; margin-top: 12px; background: none; border: 0; color: var(--muted); font-weight: 600; font-size: .92rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px; }
.link:hover { color: var(--ink); }

/* ---------- Visor de resultado (estilo computador de mergulho) ---------- */
.hero { position: relative; background: var(--abyss); color: #fff; border-radius: var(--r-l); padding: 14px 18px 14px 22px; margin-bottom: 12px; overflow: hidden;
  background-image: linear-gradient(160deg, var(--abyss-2) 0%, var(--abyss) 60%); }
.hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--abyss-ink); opacity: .55; }
.hero small { display: block; font-size: .86rem; font-weight: 500; color: var(--abyss-ink); }
.hero b { display: block; font-family: var(--num); font-size: 3.6rem; font-weight: 700; letter-spacing: -.01em; line-height: 1; margin: 6px 0 6px; }
.hero b span { font-family: var(--font); font-size: 1.1rem; font-weight: 600; letter-spacing: 0; color: var(--abyss-ink); margin-left: 2px; }
.hero em { display: block; font-style: normal; font-size: .84rem; color: var(--abyss-ink); }
.hero.green b { color: var(--g-green); } .hero.green::before { background: var(--g-green); opacity: 1; }
.hero.amber b { color: var(--g-amber); } .hero.amber::before { background: var(--g-amber); opacity: 1; }
.hero.amber em { color: #F3D9A8; }
.hero.red { background: var(--red-deep); background-image: linear-gradient(160deg, #96101A 0%, var(--red-deep) 70%); }
.hero.red::before { background: var(--g-red); opacity: 1; } .hero.red small, .hero.red em, .hero.red b span { color: #F6C3C0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.pair .hero { margin: 0; padding: 12px 14px 12px 18px; } .pair .hero b { font-size: 2.7rem; }

.fuel { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 0 0 12px; border: 1.5px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.fuel div { padding: 10px 14px; background: var(--surface); position: relative; }
.fuel div + div { border-left: 1.5px solid var(--line); }
.fuel div:not(.win) { color: var(--muted); }
.fuel div.win { background: var(--soft); }
.fuel div.win::after { content: "Limite"; position: absolute; top: 10px; right: 12px; font-size: .72rem; font-weight: 700; color: var(--abyss); background: #DCE8F0; border-radius: 99px; padding: 1px 8px; }
.fuel small { display: block; font-size: .82rem; font-weight: 500; color: var(--muted); }
.fuel b { font-family: var(--num); font-size: 1.45rem; font-weight: 700; line-height: 1.2; color: var(--ink); }
.fuel div:not(.win) b { color: var(--ink-2); }
.fuel b .fx { font-family: var(--font); font-size: .95rem; font-weight: 600; color: var(--muted); }

.air { display: flex; gap: 12px; align-items: flex-start; border-left: 4px solid var(--amber); background: var(--warn-soft); color: #5C3A00; border-radius: 4px var(--r-m) var(--r-m) 4px; padding: 12px 14px; font-size: .92rem; margin: 0 0 14px; line-height: 1.45; }
.air svg { width: 24px; height: 24px; flex: 0 0 24px; color: var(--amber); margin-top: 1px; }
.air b { color: #3D2600; }

.list { margin: 0 0 18px; }
.list div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid var(--soft-2); font-size: .96rem; }
.list div:last-child { border-bottom: 1px solid var(--soft-2); }
.list dt { color: var(--ink-2); font-weight: 500; } .list dt .fine { font-size: .78rem; } .list dd { margin: 0; font-weight: 700; text-align: right; }
.al { border-radius: 4px var(--r-m) var(--r-m) 4px; padding: 11px 14px; font-size: .93rem; margin: 0 0 12px; border-left: 4px solid; }
.al.stop { background: var(--red-soft); color: #6E0A10; border-color: var(--stop); }
.al.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--amber); }
.al.ok { background: var(--ok-soft); color: #134D30; border-color: var(--ok); }
.al b { font-weight: 700; }
.src { display: block; text-align: center; font-size: .76rem; color: var(--muted); margin: -4px 0 16px; }
.fine { font-size: .82rem; color: var(--muted); margin: 0 0 14px; line-height: 1.45; }
.muted { color: var(--muted); }

/* ---------- Passo 0 ---------- */
.tw { overflow-x: auto; margin: 0 0 12px; border: 1.5px solid var(--line); border-radius: var(--r-m); }
table.o { width: 100%; border-collapse: collapse; font-size: .86rem; table-layout: fixed; }
table.o col.c1 { width: 28%; } table.o col.c3 { width: 23%; }
table.o small { font-weight: 500; color: var(--muted); font-size: .76rem; }
table.o th { text-align: left; font-size: .8rem; font-weight: 600; color: var(--muted); padding: 10px 10px 8px; background: var(--soft); }
table.o td { padding: 11px 10px; border-top: 1px solid var(--soft-2); vertical-align: top; line-height: 1.4; }
table.o td:first-child { font-weight: 700; font-size: .92rem; line-height: 1.25; }
table.o td:last-child { font-weight: 600; }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; background: #DCE8F0; color: var(--abyss); border-radius: 99px; padding: 1px 8px; margin-top: 6px; }
ul.r { margin: 0 0 20px; padding-left: 0; list-style: none; font-size: .93rem; color: var(--ink-2); }
ul.r li { position: relative; padding: 8px 0 8px 22px; border-top: 1px solid var(--soft-2); }
ul.r li::before { content: ""; position: absolute; left: 4px; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
details ul.r li { border-top: 0; padding: 4px 0 4px 22px; } details ul.r li::before { top: 12px; }

/* ---------- Tabelas de consulta ---------- */
details { border-top: 1px solid var(--line); } details:last-of-type { border-bottom: 1px solid var(--line); }
summary { padding: 15px 2px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
summary:hover { color: var(--red); }
summary::-webkit-details-marker { display: none; } summary::after { content: "+"; font-weight: 600; font-size: 1.2rem; line-height: 1; color: var(--muted); } details[open] summary::after { content: "−"; }
.tb { overflow: auto; max-height: 60vh; border: 1.5px solid var(--line); border-radius: var(--r-m); margin-bottom: 14px; background: var(--surface); }
table.g { border-collapse: separate; border-spacing: 0; font-size: .82rem; }
table.g th, table.g td { border-right: 1px solid var(--soft-2); border-bottom: 1px solid var(--soft-2); padding: 6px 8px; text-align: center; min-width: 40px; background: var(--surface); }
table.g thead th { position: sticky; top: 0; background: var(--soft); z-index: 2; font-weight: 600; color: var(--ink-2); }
table.g th.rh { position: sticky; left: 0; background: var(--soft); z-index: 1; white-space: nowrap; font-weight: 600; }
table.g thead th.rh { z-index: 3; }
table.g td.x { background: repeating-linear-gradient(45deg, #FAFBFC, #FAFBFC 4px, #EEF1F4 4px, #EEF1F4 5px); }
table.g td.n { font-weight: 700; color: var(--red); }
table.g td.d { background: var(--abyss); color: #fff; font-size: .74rem; line-height: 1.15; } table.g td.d em { font-style: normal; color: #FFB4AE; display: block; }
table.g td.t span { display: block; line-height: 1.15; } table.g td.t .rr { color: var(--red); font-weight: 700; }
table.g .hl { background: #FFF2CC !important; color: #5C3A00; }
table.g td.hlr { background: #FFF9E6; }
table.g td.d.hlr { background: var(--abyss-2); }
table.g .hit { background: #FFC233 !important; color: #2E1D00 !important; font-weight: 700; box-shadow: inset 0 0 0 2px #A86A00; }
table.g .hit em { color: #7A0B12 !important; }

.foot { color: var(--muted); font-size: .76rem; text-align: center; padding: 18px 16px 0; line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px;
  border-radius: 12px; font-weight: 600; z-index: 40; box-shadow: 0 10px 30px rgba(20,33,44,.3); max-width: 90vw; text-align: center; }

/* ---------- Mergulhadores, cilindro, encerramento ---------- */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dmax { font-size: .86rem; color: var(--ink-2); margin: -2px 0 14px; line-height: 1.45; padding: 9px 12px; background: var(--soft); border-radius: var(--r-s); }
.dmax:empty { display: none; }
.dmax b.amb { color: #A86A00; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: -4px -18px 18px; padding: 2px 18px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 5px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: .92rem; cursor: pointer; white-space: nowrap; transition: border-color .15s; }
.chip:hover { border-color: var(--line-2); }
.chip .g { width: 32px; height: 32px; border-radius: 50%; background: var(--soft-2); display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 1.05rem; }
.chip .g.fin { background: var(--ok-soft); color: var(--ok); }
.chip.on { background: var(--abyss); color: #fff; border-color: var(--abyss); } .chip.on .g { background: #fff; color: var(--abyss); }
.chip.add { width: 44px; padding: 0; justify-content: center; font-size: 1.35rem; color: var(--red); border-style: dashed; border-color: #E5A3A6; }
.count { font-size: .82rem; font-weight: 500; color: var(--muted); margin-left: 6px; }
.diver { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: var(--r-l); padding: 14px 8px 2px 14px; margin-bottom: 12px; background: var(--surface); }
.dnum { width: 30px; height: 30px; border-radius: 50%; background: var(--abyss); color: #fff; display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 1rem; flex: 0 0 30px; margin-top: 26px; }
.dfields { flex: 1; min-width: 0; } .dfields .field { margin-bottom: 12px; }
.diver .x { background: none; border: 0; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; margin-top: 22px; }
.diver .x:hover { background: var(--red-soft); color: var(--red); }
.diver .x svg { width: 18px; height: 18px; }
.cyl { background: var(--soft); border-radius: var(--r-l); padding: 14px 14px 12px; margin: 4px 0 14px; }
.cyl > .lbl { font-size: .98rem; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.cyl .field input { background: var(--surface); }
.endd { border: 1.5px solid var(--line); border-radius: var(--r-l); padding: 14px 16px 6px; margin-bottom: 12px; }
.endd .list { margin-bottom: 10px; }
.endh { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.endh .g { width: 42px; height: 42px; border-radius: 12px; background: var(--abyss); color: #fff; display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 1.4rem; }
.endh b { flex: 1; font-size: 1.05rem; } .endh em { font-style: normal; font-size: .8rem; font-weight: 600; color: var(--muted); background: var(--soft); border-radius: 99px; padding: 2px 10px; }
.tsec { margin-top: 22px; }
.tsec h2 { display: flex; align-items: center; gap: 10px; }
.sn { width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--num); font-size: .95rem; font-weight: 700; flex: 0 0 26px; }
.tsec .tb { max-height: 320px; }

/* ===== Tablet: coluna central ===== */
@media (min-width: 640px) and (max-width: 999px) {
  html, body { background: var(--paper); }
  .page { max-width: 640px; padding: 24px 0 32px; }
  .sheet { border-radius: 22px; overflow: clip; box-shadow: 0 1px 2px rgba(20,33,44,.06), 0 12px 32px rgba(20,33,44,.08); }
  .top { position: relative; padding-left: 18px; padding-right: 18px; }
  .body { padding: 26px 28px 10px; }
  .chips { margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px; }
}

/* ===== PC: menu lateral + área de trabalho ===== */
@media (min-width: 1000px) {
  html, body { background: var(--paper); }
  .page { max-width: none; padding: 0; }
  .foot { display: none; }
